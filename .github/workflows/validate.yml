name: Validate research code

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Memory sizing tests
        run: python -m unittest discover -s experiments -p "test_*.py" -v
      - name: Programmable compute simulator tests
        run: python -m unittest discover -s sim -p "test_*.py" -v
      - name: Produce reproducible software trace
        run: python sim/gx_core.py

  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and simulate vector ALU
        run: |
          iverilog -g2012 -o /tmp/gx_alu rtl/gx_vector_alu.sv rtl/tb_gx_vector_alu.sv
          vvp /tmp/gx_alu
      - name: Compile and simulate programmable compute core
        run: |
          iverilog -g2012 -o /tmp/gx_program rtl/gx_program_core.sv rtl/tb_gx_program_core.sv
          vvp /tmp/gx_program

